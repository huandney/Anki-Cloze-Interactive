<script data-name="Cloze Interactive" data-version="v1.5.0">
// https://github.com/huandney/Anki-Cloze-Interactive/blob/main/card/front-template.html

// User Settings
var userSettings = {
    gesturesEnabled: true,    // Set to "false" to disable swipe gestures on AnkiDesktop and AnkiWeb with touch screens
    invertGestures: false,    // Set to "true" to invert swipe direction
    swipeThreshold: 50,       // Adjust this value to change swipe sensitivity (in pixels)
    autoFlip: "all",          // "all", "off", or an array: ["AnkiDesktop", "AnkiDroid", "AnkiMobile", "AnkiWeb"]
    ankiMobileTapZone: "midCenter", // AnkiMobile tap zone mapped to "Show Answer": "top", "mid" or "bottom" + "Left", "Center" or "Right"
    revealNextKeys: ["KeyW", "ArrowRight"], // Keys to reveal the next cloze - for custom keycodes: https://keycode.info/
    hideLastKeys: ["KeyQ", "ArrowLeft"],    // Keys to hide the last revealed cloze
    highlightCloze: true      // Set to "false" to disable active cloze highlighting
};

// Detects the current Anki platform
function detectAnkiPlatform() {
    if (window.anki && window.webkit?.messageHandlers?.cb !== undefined) return "AnkiMobile";
    if (typeof AnkiDroidJS !== "undefined" || window.ankiPlatform === "ankidroid") return "AnkiDroid";
    if (typeof pycmd !== "undefined") return "AnkiDesktop";
    if (/(^|\.)anki(user|web)\.net$/.test(location.hostname)) return "AnkiWeb";
    return "Unknown";
}

function initialize() {
    // Anki only renders [data-cloze] on the front side; back side or already-initialized cards are skipped
    const elements = Array.from(document.querySelectorAll(".cloze[data-cloze]"));
    if (elements[0]?.dataset.ciReady) return;

    // Cleans up event listeners and user actions from the previous card or when flipping to the back side
    window._ciAbort?.abort();
    window.userJs1 = null;
    window.userJs2 = null;
    if (!elements.length || document.querySelector(".back, #back")) return;

    elements[0].dataset.ciReady = "true";
    const { signal } = (window._ciAbort = new AbortController());

    const platform = detectAnkiPlatform();
    // AnkiMobile and AnkiDroid handle gestures natively via User Actions (userJs1 / userJs2)
    const gesturesEnabled = userSettings.gesturesEnabled && (platform === "AnkiWeb" || platform === "AnkiDesktop");

    const revealOrder = [];
    let lastScrolledEl = null;

    // Calculates fixed/sticky UI bar heights (AnkiWeb headers, AnkiMobile bottom inset) while ignoring full-screen canvases (AnkiDraw)
    function getOverlayHeights() {
        const heights = { top: 0, bottom: 0 };
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;

        document.querySelectorAll("header, nav, footer, div").forEach(el => {
            const style = window.getComputedStyle(el);
            if (style.position === "fixed" || style.position === "sticky") {
                const rect = el.getBoundingClientRect();
                // Ignores full-viewport layers such as drawing canvases or background wrappers
                if (rect.top <= 0 && rect.bottom >= windowHeight) return;
                if (rect.top <= 0 && rect.bottom < windowHeight) heights.top = Math.max(heights.top, rect.bottom);
                if (rect.bottom >= windowHeight && rect.top > 0) heights.bottom = Math.max(heights.bottom, windowHeight - rect.top);
            }
        });

        if (platform === "AnkiMobile") {
            const bottomInset = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--bottom-inset"), 10) || 0;
            heights.bottom = Math.max(heights.bottom, bottomInset);
        }

        return heights;
    }

    function isElementInViewport(el) {
        const rect = el.getBoundingClientRect();
        const { top, bottom } = getOverlayHeights();
        return (
            rect.left >= 0 &&
            rect.right <= window.innerWidth &&
            rect.top >= top &&
            rect.bottom <= window.innerHeight - bottom
        );
    }

    function highlightCloze() {
        if (!userSettings.highlightCloze || elements.length <= 1) return;
        const nextEl = elements.find(el => !el.classList.contains("revealed"));
        elements.forEach(el => el.classList.toggle("highlight-cloze", el === nextEl));
    }

    function flipToBack() {
        const shouldFlip = userSettings.autoFlip === "all" ||
            (Array.isArray(userSettings.autoFlip) && userSettings.autoFlip.includes(platform));

        if (!shouldFlip) return;

        // Platform-specific commands to trigger "Show Answer"
        const flipActions = {
            // AnkiMobile has no "Show Answer" command for cards; it only accepts simulated taps on a zone mapped in app settings
            // 200ms delay prevents conflicts with active touch gestures on iOS
            AnkiMobile: () => setTimeout(() => window.webkit.messageHandlers.cb.postMessage(JSON.stringify({ scheme: "ankitap", msg: userSettings.ankiMobileTapZone })), 200),
            AnkiWeb:    () => document.querySelector(".btn.btn-primary.btn-lg")?.click(),
            AnkiDroid:  () => showAnswer(),
            AnkiDesktop: () => pycmd("ans")
        };

        flipActions[platform]?.();
    }

    function revealCloze(el) {
        if (el.classList.contains("revealed")) return;

        el.dataset.hint = el.innerHTML;
        el.innerHTML = el.dataset.cloze;
        el.classList.add("revealed");
        revealOrder.push(el);

        // Re-renders MathJax inside the newly revealed cloze if present
        if (typeof MathJax !== "undefined") {
            MathJax.typesetPromise?.([el]);
        }

        highlightCloze();

        if (revealOrder.length === elements.length) {
            flipToBack();
        }
    }

    function revealNextCloze() {
        if (!elements[0].isConnected) return;
        const nextEl = elements.find(el => !el.classList.contains("revealed"));
        if (!nextEl) return;

        // Reveals immediately if visible, or if the previous action already scrolled to this element
        if (isElementInViewport(nextEl) || lastScrolledEl === nextEl) {
            lastScrolledEl = null;
            revealCloze(nextEl);
        } else {
            lastScrolledEl = nextEl;
            nextEl.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }

    function hideLastCloze() {
        if (!elements[0].isConnected || !revealOrder.length) return;

        const lastEl = revealOrder[revealOrder.length - 1];
        if (isElementInViewport(lastEl) || lastScrolledEl === lastEl) {
            lastScrolledEl = null;
            revealOrder.pop();
            lastEl.innerHTML = lastEl.dataset.hint;
            lastEl.classList.remove("revealed");
            highlightCloze();
        } else {
            lastScrolledEl = lastEl;
            lastEl.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }

    // Configures direct tap/click activation on clozes without triggering card gestures (AnkiDroid PR #18444 standard)
    elements.forEach(el => {
        el.classList.add("tappable");
        el.addEventListener("click", e => {
            e.stopPropagation();
            revealCloze(el);
        }, { signal });
        el.addEventListener("touchend", e => e.stopPropagation(), { passive: false, signal });
    });

    // Registers swipe gestures for AnkiDesktop and AnkiWeb touchscreens
    if (gesturesEnabled && "ontouchstart" in window) {
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener("touchstart", e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true, signal });

        window.addEventListener("touchend", e => {
            const deltaX = touchStartX - e.changedTouches[0].clientX;
            const deltaY = touchStartY - e.changedTouches[0].clientY;
            // Mostly vertical movements are scrolls, not swipes
            if (Math.abs(deltaX) <= userSettings.swipeThreshold || Math.abs(deltaX) <= Math.abs(deltaY)) return;
            const isSwipeLeft = deltaX > 0;
            (isSwipeLeft !== userSettings.invertGestures) ? hideLastCloze() : revealNextCloze();
        }, { passive: true, signal });
    }

    // Matches both KeyboardEvent.code (e.g. "KeyW") and KeyboardEvent.key (e.g. "w")
    const matchesKey = (keys, e) => {
        const code = e.code || "";
        const key = (e.key || "").toLowerCase();
        return keys.some(k => {
            const lower = k.toLowerCase();
            return k === code || lower === key || (lower.startsWith("key") && lower.slice(3) === key);
        });
    };

    // Registers keyboard shortcuts in capture phase to take precedence over Anki add-ons
    window.addEventListener("keydown", e => {
        const t = e.target;
        if (t && (t.id === "typeans" || t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
        // Leaves modified shortcuts (e.g. Alt+ArrowLeft) to the browser and Anki
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        // AnkiDesktop keeps the same page after flipping; listeners from the front must do nothing on the back
        if (!elements[0].isConnected) return;

        // Key repeat is swallowed so holding a key does not reveal every cloze at once
        if (matchesKey(userSettings.revealNextKeys, e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (!e.repeat) revealNextCloze();
        } else if (matchesKey(userSettings.hideLastKeys, e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (!e.repeat) hideLastCloze();
        }
    }, { capture: true, signal });

    // Exposes User Actions for AnkiMobile (v2.0.88+) and AnkiDroid (v2.17.0+)
    window.userJs1 = revealNextCloze;
    window.userJs2 = hideLastCloze;

    highlightCloze();
}

initialize();
</script>
